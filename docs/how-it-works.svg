<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Card -->
  <rect x="1" y="1" width="998" height="448" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1f2328">How GitBucket works</text>

  <!-- Row 1: what you do -->
  <text x="40" y="82" font-size="13" font-weight="700" letter-spacing="1.2" fill="#57606a">YOU DO THIS · TWO SECONDS</text>

  <!-- Panel 1: project folder -->
  <rect x="40" y="95" width="260" height="140" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="64" cy="119" r="13" fill="#1f2328"/>
  <text x="64" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="140" y="113" width="24" height="10" rx="2" fill="#d4a72c"/>
  <rect x="140" y="119" width="60" height="40" rx="4" fill="#eac54f"/>
  <text x="170" y="190" font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">MyApp</text>
  <text x="170" y="213" font-size="13" fill="#57606a" text-anchor="middle">any project folder</text>

  <!-- Arrow 1 -->
  <text x="335" y="153" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">right-click</text>
  <text x="335" y="190" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">drag</text>
  <line x1="304" y1="168" x2="364" y2="168" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Panel 2: drop folder (highlighted) -->
  <rect x="370" y="95" width="260" height="140" rx="12" fill="#dafbe1" stroke="#1f883d" stroke-width="3"/>
  <circle cx="394" cy="119" r="13" fill="#1f883d"/>
  <text x="394" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="546" y="108" width="72" height="22" rx="11" fill="#1f883d"/>
  <text x="582" y="123" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">DROP HERE</text>
  <rect x="470" y="113" width="24" height="10" rx="2" fill="#1a7f37"/>
  <rect x="470" y="119" width="60" height="40" rx="4" fill="#2da44e"/>
  <text x="500" y="190" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">C:\GitCheckin</text>
  <text x="500" y="213" font-size="13" fill="#1a7f37" text-anchor="middle">your drop folder · Desktop shortcut</text>

  <!-- Arrow 2 -->
  <text x="665" y="153" font-size="12" font-weight="600" fill="#57606a" text-anchor="middle">release</text>
  <line x1="634" y1="168" x2="694" y2="168" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Panel 3: context menu -->
  <rect x="700" y="95" width="260" height="140" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="724" cy="119" r="13" fill="#1f2328"/>
  <text x="724" y="124" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="750" y="110" width="190" height="112" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1"/>
  <text x="764" y="132" font-size="13" fill="#8c959f">Copy here</text>
  <text x="764" y="158" font-size="13" fill="#8c959f">Move here</text>
  <rect x="753" y="167" width="184" height="26" rx="4" fill="#0969da"/>
  <text x="764" y="185" font-size="13" font-weight="700" fill="#ffffff">Create shortcuts here</text>
  <text x="764" y="210" font-size="13" fill="#8c959f">Cancel</text>

  <!-- Hand-off connector -->
  <path d="M830 235 V258 H120 V299" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- Row 2: what GitBucket does -->
  <text x="40" y="285" font-size="13" font-weight="700" letter-spacing="1.2" fill="#57606a" dx="120">GITBUCKET DOES THE REST · AUTOMATICALLY, IN THE BACKGROUND</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="40"  y="305" width="160" height="64" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="120" y="333" fill="#1f2328">Spots the shortcut</text>
    <text x="120" y="354" font-size="12" font-weight="400" fill="#57606a">within about a second</text>

    <rect x="230" y="305" width="160" height="64" rx="10" fill="#fff1e5" stroke="#f05033" stroke-width="1.5"/>
    <text x="310" y="333" fill="#1f2328" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">git init</text>
    <text x="310" y="354" font-size="12" font-weight="400" fill="#57606a">only if it's not a repo yet</text>

    <rect x="420" y="305" width="160" height="64" rx="10" fill="#fff1e5" stroke="#f05033" stroke-width="1.5"/>
    <text x="500" y="333" fill="#1f2328" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">git add .</text>
    <text x="500" y="354" font-size="12" font-weight="400" fill="#57606a">stages every file</text>

    <rect x="610" y="305" width="160" height="64" rx="10" fill="#fff1e5" stroke="#f05033" stroke-width="1.5"/>
    <text x="690" y="333" fill="#1f2328" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">git commit</text>
    <text x="690" y="354" font-size="12" font-weight="400" fill="#57606a">timestamped message</text>

    <rect x="800" y="305" width="160" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="880" y="333" fill="#1f2328">Cleans up</text>
    <text x="880" y="354" font-size="12" font-weight="400" fill="#57606a">deletes shortcut, logs it</text>
  </g>

  <g stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="202" y1="337" x2="226" y2="337"/>
    <line x1="392" y1="337" x2="416" y2="337"/>
    <line x1="582" y1="337" x2="606" y2="337"/>
    <line x1="772" y1="337" x2="796" y2="337"/>
  </g>

  <!-- Result -->
  <rect x="40" y="392" width="920" height="38" rx="10" fill="#dafbe1"/>
  <text x="500" y="417" font-size="15" fill="#1a7f37" text-anchor="middle"><tspan font-weight="700">✓ MyApp is committed.</tspan> Drop it again any time to save a new snapshot.</text>
</svg>
